<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commands | ZooBot</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        .commands-hero {
            padding: 140px 20px 60px;
            text-align: center;
            background: radial-gradient(circle at center, rgba(0, 217, 255, 0.08) 0%, transparent 70%);
        }
        .search-container {
            max-width: 800px;
            margin: 0 auto 60px;
            position: relative;
            padding: 0 20px;
        }
        .search-bar {
            width: 100%;
            padding: 22px 30px;
            border-radius: 18px;
            border: 1px solid rgba(0, 217, 255, 0.2);
            background: rgba(15, 20, 25, 0.8);
            color: white;
            font-size: 1.25rem;
            backdrop-filter: blur(15px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .search-bar:focus {
            outline: none;
            border-color: #00D9FF;
            background: rgba(26, 31, 38, 0.9);
            box-shadow: 0 0 40px rgba(0, 217, 255, 0.25);
            transform: translateY(-2px);
        }
        .cmd-section {
            max-width: 900px;
            margin: 0 auto 100px;
            padding: 0 20px;
        }
        .category-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
            color: #00D9FF;
            font-size: 1.6rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        .category-header::after {
            content: "";
            flex: 1;
            height: 2px;
            background: linear-gradient(to right, rgba(0, 217, 255, 0.4), transparent);
        }
        .cmd-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .cmd-row {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 25px 30px;
            display: grid;
            grid-template-columns: 220px 1fr;
            align-items: center;
            transition: all 0.3s ease;
            cursor: default;
        }
        .cmd-row:hover {
            background: rgba(255,255,255,0.06);
            border-color: #00D9FF;
            transform: translateX(10px);
            box-shadow: -10px 0 20px rgba(0, 217, 255, 0.1);
        }
        .cmd-name {
            font-family: 'JetBrains Mono', monospace;
            color: #00D9FF;
            font-weight: 700;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
        }
        .cmd-name::before {
            content: "!";
            opacity: 0.4;
            margin-right: 4px;
        }
        .cmd-desc {
            color: #9ca3af;
            line-height: 1.7;
            font-size: 1.05rem;
        }
        @media (max-width: 768px) {
            .cmd-row {
                grid-template-columns: 1fr;
                gap: 12px;
                padding: 20px;
            }
            .cmd-row:hover {
                transform: translateY(-5px);
            }
        }
    </style>
</head>
<body class="dark-theme" data-theme="dark">
    <nav>
        <div class="container">
            <a href="/" class="logo">
                <img src="/logo.png" alt="ZooBot">
                <span>ZooBot</span>
            </a>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/features.html">Features</a></li>
                <li><a href="/all-cmds.html" class="active">Commands</a></li>
                <li><a href="/guide.html">Guide</a></li>
                <li><a href="/admin" class="nav-admin-btn">Admin</a></li>
            </ul>
        </div>
    </nav>

    <div class="commands-hero">
        <h1 class="animated-text" style="font-size: clamp(2.5rem, 8vw, 4rem); margin-bottom: 20px;">Command Directory</h1>
        <p style="color: #9ca3af; font-size: 1.25rem; max-width: 700px; margin: 0 auto;">Everything you need to master ZooBot, organized by system.</p>
    </div>

    <div class="search-container">
        <input type="text" id="search" class="search-bar" placeholder="Quick search commands...">
    </div>

    <div id="commands-root"></div>

    <script>
        const commandsData = {
            "Admin & Setup": {
                "setup": "Wizard: Guides server owners through initial bot configuration.",
                "setdropchannel": "Admin: Configures the channel for character drops.",
                "seteventschannel": "Admin: Configures the channel for server events.",
                "addadmin": "Admin: Grants admin privileges to a specified user.",
                "removeadmin": "Admin: Revokes admin privileges from a specified user.",
                "settings": "Admin: Opens the server settings configuration menu.",
                "toggle": "Admin: Quickly toggles specific features on or off.",
                "setemoji": "Admin: Configures custom emojis for bot elements.",
                "delete": "Admin: Deletes specified bot data."
            },
            "Character System": {
                "start": "General: Initializes your profile and gives starter rewards.",
                "select": "General: Selects your primary character for battles/profile.",
                "profile": "General: Displays your user profile and stats.",
                "levelup": "Character: Levels up your active character.",
                "char": "Character: Displays stats for a specific character.",
                "release": "Character: Releases a character to gain tokens.",
                "unlock": "Character: Unlock a character with keys.",
                "equipskin": "Character: Equips a collected skin to a character."
            },
            "Economy & Shop": {
                "crate": "Economy: View details or buy available loot crates.",
                "opencrate": "Economy: Opens a crate to reveal characters or items.",
                "bulkopen": "Economy: Opens multiple crates in a single action.",
                "daily": "Economy: Claims your daily reward and updates streak.",
                "bal": "Economy: Check your coin and gem balance.",
                "shop": "Economy: Browse items available in the shop.",
                "trade": "Economy: Initiates a secure trade with another player.",
                "market": "Economy: Access the player-to-player marketplace.",
                "auction": "Economy: Access the character auction system."
            },
            "Games & Social": {
                "battle": "Game: Initiates a battle against a player or AI.",
                "trivia": "Game: Starts a trivia session to earn rewards.",
                "clan": "Social: Shows detailed information about your clan.",
                "joinclan": "Social: Allows a user to join an existing clan.",
                "leaderboard": "Social: Displays competitive rankings.",
                "giveaway": "General: Shows status of active giveaways.",
                "lottery": "Economy: Participate in or view lottery info."
            },
            "Work & Jobs": {
                "work": "Economy: Perform your assigned job for currency.",
                "miner": "Job: Specific actions for the Miner role.",
                "caretaker": "Job: Specific actions for the Caretaker role.",
                "farmer": "Job: Specific actions for the Farmer role.",
                "zookeeper": "Job: Specific actions for the Zookeeper role.",
                "ranger": "Job: Specific actions for the Ranger role.",
                "crafttool": "Economy: Craft better tools for work efficiency."
            }
        };

        const root = document.getElementById('commands-root');
        const search = document.getElementById('search');

        function render(filter = '') {
            root.innerHTML = '';
            Object.entries(commandsData).forEach(([category, cmds]) => {
                const filteredCmds = Object.entries(cmds).filter(([name, desc]) => 
                    name.toLowerCase().includes(filter.toLowerCase()) || 
                    desc.toLowerCase().includes(filter.toLowerCase())
                );

                if (filteredCmds.length > 0) {
                    const section = document.createElement('div');
                    section.className = 'cmd-section';
                    section.innerHTML = `
                        <div class="category-header">${category}</div>
                        <div class="cmd-list">
                            ${filteredCmds.map(([name, desc]) => `
                                <div class="cmd-row">
                                    <div class="cmd-name">${name}</div>
                                    <div class="cmd-desc">${desc.split(': ')[1] || desc}</div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                    root.appendChild(section);
                }
            });
        }

        search.addEventListener('input', (e) => render(e.target.value));
        render();
    </script>
</body>
</html>
