    <style>
        .commands-container {
            max-width: 1200px;
            margin: 100px auto;
            padding: 20px;
        }
        .search-bar {
            width: 100%;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 1.1rem;
            transition: transform 0.3s ease;
        }
        .search-bar:focus {
            transform: scale(1.02);
            outline: none;
            border-color: var(--primary-color, #ff6b6b);
        }
        .command-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .command-card {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid var(--primary-color, #ff6b6b);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeInUp 0.5s ease backwards;
            cursor: pointer;
        }
        .command-card:hover {
            transform: translateY(-5px) scale(1.03);
            background: rgba(255,255,255,0.1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .command-name {
            font-weight: 700;
            color: var(--primary-color, #ff6b6b);
            font-size: 1.2rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }
        .command-name::before {
            content: "!";
            margin-right: 5px;
            opacity: 0.7;
        }
        .command-desc {
            color: #ccc;
            line-height: 1.5;
        }
        .category-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            background: rgba(255,255,255,0.1);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

            'modhelp': 'Moderation: Shows help for moderation commands.'
        };

        const grid = document.getElementById('command-grid');
        const search = document.getElementById('search');

        function renderCommands(filter = '') {
            grid.innerHTML = '';
            let count = 0;
            Object.entries(commands).forEach(([name, fullDesc]) => {
                if (name.toLowerCase().includes(filter.toLowerCase()) || 
                    fullDesc.toLowerCase().includes(filter.toLowerCase())) {
                    
                    const [category, desc] = fullDesc.split(': ');
                    const card = document.createElement('div');
                    card.className = 'command-card';
                    card.style.animationDelay = `${count * 0.05}s`;
                    
                    card.innerHTML = `
                        <span class="category-tag">${category}</span>
                        <div class="command-name">${name}</div>
                        <div class="command-desc">${desc}</div>
                    `;
                    grid.appendChild(card);
                    count++;
                }
            });
        }

        search.addEventListener('input', (e) => renderCommands(e.target.value));
        renderCommands();
    </script>
</body>
</html>
